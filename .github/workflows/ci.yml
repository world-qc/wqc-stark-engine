name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  build-fast:
    name: Build and fast tests
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.95"
          components: rustfmt, clippy

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: cargo fmt
        run: cargo fmt --all -- --check

      - name: cargo clippy
        run: cargo clippy --all-targets --all-features --locked -- -D warnings

      - name: cargo build
        run: cargo build --locked --verbose

      - name: cargo test (fast, release)
        run: cargo test --release --locked --verbose

  plonky3-slow-release:
    name: Plonky3 slow tests (release)
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.95"

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: cargo test (plonky3-stark slow ignored, release)
        run: cargo test -p wqc-stark-core --features plonky3-stark --release --locked --verbose -- --ignored
