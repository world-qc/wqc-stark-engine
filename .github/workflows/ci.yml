name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  build:
    name: Build and test
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.95"
          components: rustfmt, clippy

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: cargo fmt
        run: cargo fmt --all -- --check

      - name: cargo clippy
        run: cargo clippy --all-targets --all-features --locked -- -D warnings

      - name: cargo build
        run: cargo build --locked --verbose

      # Fast suite only (release). Heavy RecAgg / PCS roundtrips are #[ignore]
      # and must be run locally — they are multi-hour on GHA and blow minute quotas.
      - name: cargo test (release, skip ignored)
        run: cargo test --release --locked --verbose

      # E5b-1a: plonky3-stark + shrink fast bounds (R2 size, baseline JSON).
      - name: cargo test (plonky3-stark, release, skip ignored)
        run: cargo test -p wqc-stark-core --features plonky3-stark --release --locked --verbose
