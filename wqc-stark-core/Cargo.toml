[package]
name = "wqc-stark-core"
version = "0.1.0"
edition = "2021"

[features]
default = []
plonky3-stark = ["p3-uni-stark", "p3-air", "p3-circle", "p3-commit", "p3-challenger", "p3-fri", "p3-keccak", "p3-merkle-tree", "p3-symmetric", "p3-util", "postcard"]

[dependencies]
p3-field = "0.6.1"
p3-mersenne-31 = "0.6.1"
p3-matrix = "0.6.1"
sha3 = "0.10"
hex = "0.4"
rand = "0.8"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
p3-uni-stark = { version = "0.6.1", optional = true }
p3-air = { version = "0.6.1", optional = true }
p3-circle = { version = "0.6.1", optional = true }
p3-commit = { version = "0.6.1", optional = true }
p3-challenger = { version = "0.6.1", optional = true }
p3-fri = { version = "0.6.1", optional = true }
p3-keccak = { version = "0.6.1", optional = true }
p3-merkle-tree = { version = "0.6.1", optional = true }
p3-symmetric = { version = "0.6.1", optional = true }
p3-util = { version = "0.6.1", optional = true }
postcard = { version = "1.1", optional = true, features = ["alloc"] }

[[bin]]
name = "shrink-baseline"
path = "src/bin/shrink-baseline.rs"
required-features = ["plonky3-stark"]
