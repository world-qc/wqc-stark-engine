[package]
name = "wqc-sv-stark"
version = "0.1.0"
edition = "2021"
description = "State-vector STARK leaf (v2) on Goldilocks with recursive aggregation via Plonky3-recursion"

[dependencies]
# Plonky3-recursion has no release newer than 0.1.0; pin main to an exact commit.
p3-circuit = { git = "https://github.com/Plonky3/Plonky3-recursion", rev = "3a69ba61f713c8400b14eb3d8f0e52caa13512c7" }
p3-circuit-prover = { git = "https://github.com/Plonky3/Plonky3-recursion", rev = "3a69ba61f713c8400b14eb3d8f0e52caa13512c7" }
p3-recursion = { git = "https://github.com/Plonky3/Plonky3-recursion", rev = "3a69ba61f713c8400b14eb3d8f0e52caa13512c7" }
p3-air = "=0.9.0-rc.2"
p3-batch-stark = "=0.9.0-rc.2"
p3-commit = "=0.9.0-rc.2"
p3-dft = "=0.9.0-rc.2"
p3-field = "=0.9.0-rc.2"
p3-goldilocks = "=0.9.0-rc.2"
p3-lookup = "=0.9.0-rc.2"
p3-matrix = "=0.9.0-rc.2"
p3-merkle-tree = "=0.9.0-rc.2"
p3-maybe-rayon = { version = "=0.9.0-rc.2", features = ["parallel"] }
p3-poseidon2-air = "=0.9.0-rc.2"
p3-symmetric = "=0.9.0-rc.2"
p3-uni-stark = "=0.9.0-rc.2"
p3-util = "=0.9.0-rc.2"
# Rotation matrices are quantized with this pure-Rust libm, not the platform's, so every
# party derives the same circuit; pin it exactly.
libm = "=0.2.16"
# The digest's Poseidon2 constants come from a seeded SmallRng; pin rand exactly (see the
# digest known-answer test).
rand = { version = "=0.10.3", default-features = false }
# The leaf context is SHA3-256 of the dispatch fields (see `leaf::Dispatch::context`); pinned
# like the other dependencies that fix a value every party must derive.
sha3 = "=0.10.9"
# Proof bytes on the wire: prover (wqc-core) and verifier (the FFI) must agree, so pin it.
postcard = { version = "=1.1.3", features = ["alloc"] }
serde = { version = "1.0", features = ["derive"] }
# float_roundtrip: read rotation angles to the exact f64 the orchestrator marshaled, so the
# prover and the verifier quantize the same matrices (feature unification turns it on for
# every serde_json user in the build).
serde_json = { version = "1.0", features = ["float_roundtrip"] }
